services:
  db:
    image: chromadb/chroma
    container_name: mimir_memory
    volumes:
      - ./data/vector_store:/chroma/data
    ports:
      - "127.0.0.1:8000:8000"

  advisor:
    build: .
    container_name: mimir_logic
    depends_on:
      - db
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      VECTOR_DB_URL: http://db:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - ./data:/app/data
