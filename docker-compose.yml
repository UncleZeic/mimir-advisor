services:
  advisor:
    build: .
    container_name: mimir_logic
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      INDEX_DIR: /app/data/index
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - ./data:/app/data
